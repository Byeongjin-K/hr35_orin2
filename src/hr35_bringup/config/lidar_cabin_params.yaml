lidar_cabin:
  os_driver:
    ros__parameters:
      # sensor_hostname[required]: hostname or IP address of the sensor (IP4 or IP6).
      sensor_hostname: '192.168.0.6'
      # udp_dest[optional]: hostname or multicast group IP where the sensor will send UDP data packets.
      udp_dest: ''
      # mtp_dest[optional]: hostname IP address for receiving data packets via multicast
      mtp_dest: ''
      # mtp_main[optional]: if true, then configure and reinit the sensor
      mtp_main: false
      # lidar_mode[optional]: resolution and rate
      # Pinned rather than inherited. An empty value means "use whatever the sensor
      # has stored", and persist_config is false, so a sensor swap or a firmware
      # reset would silently change the resolution. 512x10 is what the boom sensor
      # reports in its own recorded metadata; the cabin is set to match so the two
      # LiDARs produce comparable data.
      lidar_mode: '512x10'
      # timestamp_mode[optional]: method used to timestamp measurements
      # Match the boom sensor. Left empty, the driver falls back to the sensor's own
      # oscillator, and a recording made that way cannot be fed to a SLAM tool: the
      # clouds land ~1.76e9 s away from the GNSS on the host clock, so the tool drops
      # every scan after the first. That cost a full debugging session on the 2025 bags.
      timestamp_mode: 'TIME_FROM_ROS_TIME'
      # ptp_utc_tai_offset[optional]: UTC/TAI offset in seconds
      ptp_utc_tai_offset: -37.0
      # udp_profile_lidar[optional]: lidar packet profile
      # Same reason as lidar_mode: this is the profile the boom sensor already uses,
      # made explicit. It carries range, reflectivity, signal and near-IR.
      udp_profile_lidar: 'RNG19_RFL8_SIG16_NIR16'
      # metadata[optional]: path to save metadata file to
      metadata: ''
      # lidar_port[optional]: port value should be in the range [0, 65535]
      lidar_port: 7502
      # imu_port[optional]: port value should be in the range [0, 65535]
      imu_port: 7503
      # sensor_frame[optional]: name to use when referring to the sensor frame
      sensor_frame: lidar_cabin/os_sensor
      # lidar_frame[optional]: name to use when referring to the lidar frame
      lidar_frame: lidar_cabin/os_lidar
      # imu_frame[optional]: name to use when referring to the imu frame
      imu_frame: lidar_cabin/os_imu
      # point_cloud_frame[optional]: which frame of reference to use
      point_cloud_frame: lidar_cabin/os_lidar
      # pub_static_tf[optional]: when this flag is set to True, the driver will broadcast the TF transforms
      pub_static_tf: true
      # proc_mask[optional]: use any combination of the 4 flags IMG, PCL, IMU and SCAN
      # Only the point cloud and the IMU are consumed. Verified on the running system:
      # /lidar_boom/points has 2 subscribers and /lidar_boom/imu has 1, while scan,
      # range/signal/nearir/reflec_image and lidar/imu_packets all have 0. Producing
      # them costs CPU and DDS bandwidth for nothing, doubled across two sensors.
      # NOTE: dropping RAW also removes the packet topics, so a future recording
      # cannot be re-processed into points at different driver settings. Add RAW back
      # if that ever becomes wanted.
      proc_mask: IMU|PCL
      # scan_ring[optional]: select which beam of the LidarScan to use
      scan_ring: 0
      # use_system_default_qos[optional]: if false, data are published with sensor data QoS
      # Matched to the boom sensor. A RELIABLE subscriber receives nothing at all from
      # a BEST_EFFORT publisher, so with the cabin on the opposite setting it would
      # simply appear dead to the existing stack - a silent failure, not an error.
      use_system_default_qos: true
      # point_type[optional]: choose from: {original, native, xyz, xyzi, xyzir}
      point_type: original
      # azimuth window start[optional]: values range [0, 360000] millidegrees
      azimuth_window_start: 0
      # azimuth_window_end[optional]: values range [0, 360000] millidegrees
      azimuth_window_end: 360000
      # persist_config[optional]: request the sensor to persist settings
      persist_config: false
      # attempt_config[optional]: attempting to reconnect to the sensor after connection loss
      # Was false while max_failed_reconnect_attempts sat at 2147483647 - the two
      # settings contradicted each other. On a machine in the field a brief network
      # or power glitch otherwise leaves the LiDAR dead until someone restarts it.
      attempt_reconnect: true
      # dormant_period_between_reconnects[optional]: wait time in seconds between reconnection attempts
      dormant_period_between_reconnects: 1.0
      # max_failed_reconnect_attempts[optional]: maximum number of attempts
      max_failed_reconnect_attempts: 2147483647
      # organized[optional]: whether to generate an organized point cloud
      organized: true
      # destagger[optional]: enable or disable point cloud destaggering
      destagger: true
      # min_range[optional]: minimum lidar range to consider (meters)
      min_range: 0.0
      # max_range[optional]: maximum lidar range to consider (meters)
      max_range: 1000.0 