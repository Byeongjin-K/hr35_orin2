/**:
  ros__parameters:

    general:
      serial_number: 45233238
      camera_model: 'zedx'
      camera_name: 'zedx_boom'
      base_frame: 'zedx_boom_base_link'
      tf_prefix: 'zedx_boom'
      gpu_id: 0
      # 해상도/레이트: ZED X는 HD1200/HD1080/SVGA + 15/30/60fps(SVGA는 120도)만 지원
      grab_resolution: 'HD1200'        # SVGA(960x600 비닝)→네이티브 1920x1200 전체 화소 사용
      grab_frame_rate: 15              # grab 비용은 pub_frame_rate와 무관한 고정비. 15 유지
      pub_frame_rate: 10.0             # 2→10 (실측: zed_node CPU 1코어의 +11%p = 전체의 +0.9%)
      pub_resolution: 'CUSTOM'         # 그랩은 풀해상도, 발행만 축소해 대역폭 관리
      pub_downscale_factor: 1.5        # 1920x1200 / 1.5 = 1280x800 발행
      camera_flip: false
      self_calib: false               # 초기화 시간 단축/요인 제거

    video:
      # 수동값으로 Argus가 초기화에 실패하는 경우가 있어 일단 AUTO로
      auto_exposure_gain: true
      # 아래 수동 파라미터는 주석/삭제 (임시)
      # exposure_time: 16000
      # analog_gain: 1255
      # digital_gain: 1
      # auto_*_range_*: (범위들도 일단 기본값으로)
      denoising: 50                   # 0→50 (ZED 기본값). 실측 노이즈 -40%, 엣지는 유지
      exposure_compensation: 50       # 0→50 (ZED 기본값=중립). 0은 -EV 바이어스라 항상 어둡게 찍힘
      auto_whitebalance: true

    depth:
      depth_mode: "NONE"
      point_cloud_freq: 0.0

    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false

    object_detection:
      od_enabled: false
      detection_model: 'MULTI_CLASS_BOX_FAST'
      enable_tracking: false
      filtering_mode: 'NMS3D'

    body_tracking:
      bt_enabled: false
      enable_tracking: false
      enable_body_fitting: false

    sensors:
      publish_imu_tf: false
      sensors_image_sync: false
      sensors_pub_rate: 10.0             # 50→10 (tracking OFF이므로 최소한)

    debug:
      sdk_verbose: 1                  # 3→1 (로그 출력 부하 감소)
      debug_common: false
      debug_video_depth: false
      debug_positional_tracking: false
      debug_object_detection: false
      debug_body_tracking: false

    # ── image_transport 플러그인 제한 ──────────────────────────
    # Humble의 image_transport는 파라미터명에 node_name을 포함.
    # 파라미터: <node_name>.<topic_path>.enable_pub_plugins
    zedx_boom_node:
      rgb:
        image_rect_color:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      rgb_gray:
        image_rect_gray:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      rgb_raw:
        image_raw_color:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      rgb_raw_gray:
        image_raw_gray:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      left:
        image_rect_color:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      left_gray:
        image_rect_gray:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      left_raw:
        image_raw_color:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      left_raw_gray:
        image_raw_gray:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      right:
        image_rect_color:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      right_gray:
        image_rect_gray:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      right_raw:
        image_raw_color:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      right_raw_gray:
        image_raw_gray:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      stereo:
        image_rect_color:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
      stereo_raw:
        image_raw_color:
          enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
