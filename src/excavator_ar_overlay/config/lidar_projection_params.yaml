# Stage 1 AR overlay: LiDAR reprojection onto the ZED X boom camera.
#
# Every topic name lives here rather than in code, per the project SSOT rule.
#
# extrinsic.xyz / extrinsic.rpy are the ONLY values that need field calibration.
# They are dynamic parameters, so the loop is:
#
#   ros2 param set /lidar_projection_node extrinsic.xyz "[0.10, 0.0, -0.05]"
#   ros2 param set /lidar_projection_node extrinsic.rpy "[-1.5708, 0.0, -1.5708]"
#
# and watch /excavator/perception/dig_overlay/compressed until the coloured
# points sit on the real contours of the scene. Once converged, move the final
# value into a static_transform_publisher or the URDF and set
# extrinsic.publish_static_tf to false here.
/**:
  ros__parameters:

    topics:
      # 캐빈 상단 카메라. 붐 하단 카메라는 각도상 버킷이 닿는 작업영역을 대부분
      # 보지 못해 2026-08-13에 교체했다.
      image_in: '/zedx_cabin/zedx_cabin_node/rgb/image_rect_color/compressed'
      camera_info_in: '/zedx_cabin/zedx_cabin_node/rgb/camera_info'
      points_in: '/lidar_boom/points'
      overlay_out: '/excavator/perception/dig_overlay/compressed'
      ai_action_in: '/ai_status/action'
      grid_map_in: '/rn/grid_map'
      # Colour source only. current-target is a difference, so it is independent
      # of the datum those heights share; absolute height for 3D placement still
      # comes from grid_map_in, whose frame is known.
      task_info_in: '/task_info'

    layers:
      lidar_points: true     # stage 1: extrinsic verification
      dig_plan: true         # stage 2: AI selected cells

    # AI[i, j] = GUI[swing_axis_row_in_gui_grid + i, j]. Declared at the top
    # level with this exact name so the shared SSOT file
    #   excavator_task_config_gui/config/ai_grid_calibration.yaml
    # can be passed to this node unchanged:
    #   ros2 launch excavator_ar_overlay lidar_projection.launch.py \
    #     params_file:=/home/kimm/hr35/src/excavator_task_config_gui/config/ai_grid_calibration.yaml
    # Field calibration procedure: docs/guides/ai_coordinate_diagnostic_calibration.md
    # 2026-09-09 hr35 정본이 TF 실측으로 0 을 확정했다(종전 -2 는 스윙축이
    # x=-0.30 m 에 있다는 주장이었고, 모든 굴착 명령이 0.30 m 멀리 나갔다).
    # 이 노드가 그리는 위치는 이 값과 무관하다 — dig 셀은 AI 행으로 들어오고
    # forward_m = ai_row * cell_size 이기 때문이다. 정본과 어긋난 기본값을
    # 남겨두지 않으려고 맞춘다.
    swing_axis_row_in_gui_grid: 0

    grid:
      # +x forward, +y lateral-left. Established from the live TF tree, not
      # assumed: gm_boom_link (0.860, 0.017, 1.273) and gm_lidar_mount
      # (2.201, 0.065, 2.119) are both boom-mounted and differ from the swing
      # axis almost purely in +x.
      anchor_frame: 'gm_swing_axis'
      elevation_layer: 'elevation'
      # /rn/grid_map is currently silent (its upstream voxelizer emits empty
      # clouds), so the overlay falls back to a flat plane at this height
      # rather than dropping the dig layer entirely.
      fallback_height_m: 0.0

    dig:
      fill_alpha: 0.35
      outline_thickness: 1
      start_marker_radius_px: 7

    publish:
      rate_hz: 2.0
      width: 640
      height: 400
      jpeg_quality: 80

    lidar:
      near_m: 1.0            # colour ramp near end (blue)
      far_m: 15.0            # colour ramp far end (red)
      min_depth_m: 0.3       # cull points at/behind the camera plane
      max_points: 40000      # cloud is 512x128 = 65536; stride down to this
      point_radius_px: 0     # 0 = single pixel scatter (fast); 1..2 = fatter dots
      # 클라우드를 다른 프레임으로 재해석한다. 비우면 헤더 프레임을 쓴다.
      #
      # 2026-08-18 보정 캐프처 8포즈(붐 -61.5 ~ -5.7도)로 판정 완료.
      # 지면은 움직이지 않으므로 맵 프레임에서 본 지면 평면은 붐 각도와
      # 무관해야 한다. 실측:
      #                       높이편차   기울기편차   붐각 상관
      #   gm_os_lidar          0.029 m     0.50 deg    r=+0.32  (+0.2 mm/deg)
      #   lidar_boom/os_lidar  3.128 m    50.37 deg    r=+0.98 (+53.9 mm/deg)
      #
      # placeholder 체인은 붐각과 거의 완벽한 선형 상관을 보인다 — 붐 회전이
      # 통째로 빠진 서명이다. TF 자체로도 확인된다: 55.8도 스윈 동안
      # gm_os_lidar 는 수직 1.223 m 움직였고 lidar_boom/os_lidar 는 0 m 였다.
      #
      # 2026-09-22 재확인 — 이번엔 붐 스윕 없이, 살아 있는 /rn/grid_map 을
      # 독립 기준으로 삼아 한 포즈에서 판정했다. 셀 481개 중심에서 라이다
      # 지면(하위 20 퍼센타일)과 grid map 고도를 비교:
      #                       |dz| 중앙값   p90      매칭 셀
      #   gm_os_lidar          0.065 m     0.240 m   225/481
      #   lidar_boom/os_lidar  1.776 m     2.838 m   164/481
      #
      # 즉 기구학 체인만이 dig 레이어가 읽는 지형과 반 셀(0.075 m) 안에서
      # 일치한다. placeholder 의 오차는 몇 분 사이 +0.541 m -> -1.776 m 로
      # 바뀌었다(그 사이 붐이 움직였다) — 붐각 의존성의 직접 증거다.
      #
      # 근본 수정은 2026-09-22 에 적용됐고 기동까지 확인했다: hr35_bringup 의
      # static TF 가 이제 map 이 아니라 gm_os_lidar 를 부모로 삼는다. 그 결과
      # 헤더 프레임이 기구학 프레임과 **항등**이 됐다(라이브 실측):
      #   ros2 run tf2_ros tf2_echo gm_os_lidar lidar_boom/os_lidar
      #   -> translation [0, 0, 0], rpy [0, 0, 0]
      #
      # 따라서 이 값은 이제 없어도 결과가 같다. 그래도 남겨 둔다 — 고치기 전
      # bringup 으로 띄운 세션에서는 여전히 이 값이 올바른 체인을 강제한다.
      # 워크스페이스 전체가 고친 런치로만 돌게 되면 빈 문자열로 되돌릴 것.
      override_frame: 'gm_os_lidar'

    hud:
      font_scale: 0.5        # raise if text is unreadable in the 360 px GUI panel

    tf:
      lookup_timeout_s: 1.0

    extrinsic:
      publish_static_tf: true
      # parent 는 반드시 캐빈 강체 프레임이어야 한다. 카메라는 캐빈에, LiDAR는
      # 붐에 있어서 카메라↔LiDAR 변환은 상수가 아니다. 동일 시각 실측:
      #   gm_swing_axis  -4.68 deg   gm_boom_hinge  -4.74 deg   ← 캐빈 강체
      #   gm_boom_link  -44.25 deg   gm_lidar_mount -44.20 deg   ← 붐 강체
      # gm_swing_axis 를 고른 이유: dig 셀이 이미 이 프레임에서 계산되므로
      # 셀→픽셀이 상수 변환 하나로 줄고, 붐 기구학 오차가 오버레이로 새지 않는다.
      parent_frame: 'gm_swing_axis'
      child_frame: 'zedx_cabin_left_camera_optical_frame'
      # UNCALIBRATED. 2026-08-12의 coarse 값은 붐 카메라↔LiDAR 것이라 이전되지
      # 않아 0으로 되돌렸다. rpy 는 x-forward/y-left/z-up parent → optical
      # 규약 매핑일 뿐이며, 작업면을 내려다보는 캐빈 카메라는 여기에 상당한
      # pitch 가 더 붙을 것이다.
      xyz: [0.0, 0.0, 0.0]
      rpy: [-1.5707963267948966, 0.0, -1.5707963267948966]
