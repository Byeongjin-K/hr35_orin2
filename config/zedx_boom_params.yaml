/**:
  ros__parameters:

    general:
      serial_number: 45233238
      camera_model: 'zedx'
      camera_name: 'zedx_boom'
      base_frame: 'zedx_boom_base_link'
      tf_prefix: 'zedx_boom'
      gpu_id: 0
      # Argus/드라이버 타이밍 완화
      grab_resolution: 'HD720'        # ↓ 임시 하향
      grab_frame_rate: 15             # 10→15도 안정적인 편. (이후 필요시 10으로 복구)
      pub_frame_rate: 5.0             # grab FPS 이하 유지
      pub_resolution: 'NATIVE'        # CUSTOM 대신 NATIVE로 단순화 (임시)
      pub_downscale_factor: 1.0       # NATIVE일 땐 1.0
      camera_flip: false
      self_calib: false               # 초기화 시간 단축/요인 제거

    video:
      # 수동값으로 Argus가 초기화에 실패하는 경우가 있어 일단 AUTO로
      auto_exposure_gain: true
      # 아래 수동 파라미터는 주석/삭제 (임시)
      # exposure_time: 16000
      # analog_gain: 1255
      # digital_gain: 1
      # auto_*_range_*: (범위들도 일단 기본값으로)
      denoising: 0                    # 임시로 해제
      exposure_compensation: 0        # 임시로 0
      auto_whitebalance: true

    depth:
      depth_mode: "NONE"
      point_cloud_freq: 0.0

    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false

    object_detection:
      od_enabled: false
      detection_model: 'MULTI_CLASS_BOX_FAST'
      enable_tracking: false
      filtering_mode: 'NMS3D'

    body_tracking:
      bt_enabled: false
      enable_tracking: false
      enable_body_fitting: false

    sensors:
      publish_imu_tf: false
      sensors_image_sync: false
      sensors_pub_rate: 50.0

    debug:
      sdk_verbose: 3                  # 로그를 잠시 높여 원인 파악
      debug_common: false
      debug_video_depth: false
      debug_positional_tracking: false
      debug_object_detection: false
      debug_body_tracking: false
